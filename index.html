<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Brouillard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brouillard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --fond: #14171c; --carte: #1e232b; --texte: #eef1f5; --doux: #8b95a5;
    --accent: #9fb8d9; --ok: #7fcf9a; --attente: #e0b060; --trait: #2c333e;
  }
  @media (prefers-color-scheme: light) {
    :root { --fond: #f2f4f7; --carte: #ffffff; --texte: #1a1e25; --doux: #6a7484;
            --accent: #3f6ea8; --ok: #2e8f55; --attente: #b07a10; --trait: #dde2e9; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; margin: 0; }
  html { height: 100%; }
  body {
    background: var(--fond); color: var(--texte);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; gap: 14px;
    max-width: 520px; margin: 0 auto; overscroll-behavior: none;
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; color: var(--doux); letter-spacing: .02em; }
  .icone { background: none; border: 0; color: var(--doux); font-size: 24px; padding: 6px 4px; }
  #cadran { display: block; width: min(62vw, 240px); margin: 0 auto; touch-action: none; outline: none;
    -webkit-user-select: none; user-select: none; }
  #cadran path { fill: none; stroke-width: 14; stroke-linecap: round; }
  #piste { stroke: var(--trait); }
  #progres { stroke: var(--accent); }
  #curseur { fill: var(--accent); stroke: var(--fond); stroke-width: 4; }
  #reperes circle { fill: var(--doux); opacity: .55; }
  #cadran text { fill: var(--doux); font-size: 15px; text-anchor: middle; }
  #cadran #valeur { fill: var(--texte); font-size: 96px; font-weight: 200; dominant-baseline: central;
    font-variant-numeric: tabular-nums; }
  button.principal { width: 100%; padding: 18px; font-size: 19px; font-weight: 600; border: 0; border-radius: 16px;
    background: var(--accent); color: var(--fond); }
  button.principal:active { opacity: .8; }
  button.secondaire { width: 100%; padding: 13px; font-size: 16px; border: 1px solid var(--trait); border-radius: 12px;
    background: transparent; color: var(--texte); }
  #etat { text-align: center; font-size: 14px; color: var(--doux); min-height: 20px; }
  #note { background: var(--carte); }
  #familles { display: flex; gap: 6px; }
  .famille, .sous { border: 1.5px solid var(--c); border-radius: 999px; background: transparent; color: var(--texte);
    font: inherit; line-height: 1.2; }
  .famille { flex: 1 1 0; min-width: 0; padding: 9px 0; font-size: 12.5px; font-weight: 600; }
  .famille.ouverte { background: color-mix(in srgb, var(--c) 24%, transparent); }
  #sous { display: flex; flex-wrap: wrap; gap: 8px; }
  #sous:empty { display: none; }
  .sous { padding: 8px 13px; font-size: 15px; }
  .famille.choisie, .sous.choisie { background: var(--c); color: #14171c; }
  #traces { list-style: none; margin: auto 0 0; padding: 0; font-size: 12px; color: var(--doux); opacity: .8;
    font-variant-numeric: tabular-nums; }
  #traces li { display: flex; align-items: center; gap: 7px; line-height: 1.7; }
  #traces .pastille { width: 6px; height: 6px; }
  .pastille { width: 9px; height: 9px; border-radius: 50%; background: var(--attente); }
  .pastille.ok { background: var(--ok); }
  dialog { border: 0; border-radius: 18px; background: var(--carte); color: var(--texte); width: min(92vw, 460px); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 14px; font-size: 19px; }
  dialog label { display: block; font-size: 14px; color: var(--doux); margin: 14px 0 6px; }
  #note, dialog input[type=url], dialog input[type=text], dialog select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--trait); background: var(--fond); color: var(--texte); }
  dialog .rangee { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>
  <header>
    <h1>Brouillard</h1>
    <button class="icone" id="ouvrirReglages" aria-label="Réglages">⚙︎</button>
  </header>

  <svg id="cadran" viewBox="0 0 300 300" role="slider" tabindex="0" aria-label="Valeur de 0 à 10" aria-valuemin="0" aria-valuemax="10">
    <path id="piste"/>
    <path id="progres"/>
    <g id="reperes"></g>
    <circle id="curseur" r="17"/>
    <text id="valeur" x="150" y="150">5</text>
    <text x="62" y="278">0</text>
    <text x="238" y="278">10</text>
  </svg>

  <div id="familles" role="group" aria-label="Familles d'émotions"></div>
  <div id="sous" role="group" aria-label="Émotions"></div>

  <input type="text" id="note" placeholder="Note (facultatif)" autocomplete="off" enterkeyhint="done">

  <button class="principal" id="enregistrer">Enregistrer</button>
  <div id="etat"></div>

  <ul id="traces" aria-label="Derniers enregistrements"></ul>

  <dialog id="reglages">
    <h2>Réglages</h2>
    <label for="url">Adresse du script Google Sheet</label>
    <input type="url" id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off">
    <label for="raccourci">Raccourci santé à lancer après Enregistrer (vide = aucun)</label>
    <input type="text" id="raccourci" placeholder="Brouillard Santé" autocomplete="off">
    <label for="pas">Finesse du cadran</label>
    <select id="pas">
      <option value="1">11 valeurs (0, 1, 2 … 10)</option>
      <option value="0.5">21 valeurs (pas de 0,5)</option>
      <option value="0.1">101 valeurs (pas de 0,1)</option>
    </select>
    <div class="rangee">
      <button class="principal" id="fermerReglages">OK</button>
      <button class="secondaire" id="exporter">Exporter en CSV</button>
    </div>
  </dialog>

<script>
const CLE_CFG = 'brouillard.cfg', CLE_MESURES = 'brouillard.mesures';
const $ = id => document.getElementById(id);

const lire = (cle, defaut) => { try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; } catch { return defaut; } };
const ecrire = (cle, v) => { try { localStorage.setItem(cle, JSON.stringify(v)); } catch {} };

let cfg = { url: '', pas: 1, raccourci: '', ...lire(CLE_CFG, {}) };
let mesures = lire(CLE_MESURES, []);   // { id, iso, valeur, familles, emotions, note, envoye }
let envoiEnCours = false, erreurEnvoi = '';

// Heure locale exacte avec décalage, ex. 2026-10-01T09:18:42.123-04:00
function isoLocal(d) {
  const p = (n, l = 2) => String(n).padStart(l, '0');
  const dec = -d.getTimezoneOffset(), s = dec >= 0 ? '+' : '-', a = Math.abs(dec);
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}${s}${p(a / 60 | 0)}:${p(a % 60)}`;
}

const afficherValeur = v => String(v).replace('.', ',');

// Cadran : arc de 270° ouvert vers le bas, 0 en bas à gauche, 10 en bas à droite
const CX = 150, CY = 150, RAYON = 120, ANGLE0 = 135, BALAYAGE = 270;
let valeur = 5, glisse = false;

const point = (angle, r = RAYON) => {
  const t = angle * Math.PI / 180;
  return [CX + r * Math.cos(t), CY + r * Math.sin(t)];
};
const arc = (a0, a1) => {
  const [x0, y0] = point(a0), [x1, y1] = point(a1);
  return `M${x0} ${y0}A${RAYON} ${RAYON} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
};

function dessinerCadran() {
  const angle = ANGLE0 + BALAYAGE * valeur / 10, [x, y] = point(angle);
  $('progres').setAttribute('d', valeur > 0 ? arc(ANGLE0, angle) : '');
  $('curseur').setAttribute('cx', x);
  $('curseur').setAttribute('cy', y);
  $('valeur').textContent = afficherValeur(valeur);
  $('cadran').setAttribute('aria-valuenow', valeur);
}

function reglerValeur(v) {
  v = Math.round(v / cfg.pas) * cfg.pas;
  valeur = Number(Math.min(10, Math.max(0, v)).toFixed(1));
  dessinerCadran();
}

function valeurDuPointeur(e, premierContact) {
  const r = $('cadran').getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  let rel = (Math.atan2(dy, dx) * 180 / Math.PI - ANGLE0 + 720) % 360;
  if (rel > BALAYAGE) rel = rel > BALAYAGE + (360 - BALAYAGE) / 2 ? 0 : BALAYAGE;   // dans l'ouverture du bas
  const v = rel / BALAYAGE * 10;
  // en glissant, on ne saute pas de 10 à 0 en traversant l'ouverture
  if (!premierContact && Math.abs(v - valeur) > 5) return;
  reglerValeur(v);
}

function initialiserCadran() {
  $('piste').setAttribute('d', arc(ANGLE0, ANGLE0 + BALAYAGE));
  for (let i = 0; i <= 10; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'), [x, y] = point(ANGLE0 + BALAYAGE * i / 10, 97);
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', i % 5 ? 1.6 : 2.6);
    $('reperes').appendChild(c);
  }
  const svg = $('cadran');
  svg.addEventListener('pointerdown', e => { glisse = true; svg.setPointerCapture(e.pointerId); valeurDuPointeur(e, true); });
  svg.addEventListener('pointermove', e => { if (glisse) valeurDuPointeur(e, false); });
  for (const fin of ['pointerup', 'pointercancel']) svg.addEventListener(fin, () => { glisse = false; });
  svg.addEventListener('keydown', e => {
    const sens = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (sens) { e.preventDefault(); reglerValeur(valeur + sens * cfg.pas); }
  });
}

// Émotions : 5 familles, puis leurs sous-familles (reference/Taxonomie_Emotions_V0.md).
// Les noms de sous-familles sont uniques d'une famille à l'autre.
const TAXONOMIE = [
  { nom: 'Joie', couleur: '#e3b23c', sous: ['Émerveillement', 'Enthousiasme', 'Contentement', 'Amusement', 'Fierté', 'Espoir'] },
  { nom: 'Amour', couleur: '#e0679a', sous: ['Tendresse', 'Passion', 'Gratitude', 'Compassion', 'Appartenance', 'Confiance'] },
  { nom: 'Tristesse', couleur: '#7f9ec4', sous: ['Mélancolie', 'Perte', 'Solitude', 'Découragement', 'Déception', 'Détresse'] },
  { nom: 'Peur', couleur: '#9a7bd0', sous: ['Inquiétude', 'Anxiété', 'Frayeur', 'Vulnérabilité', 'Confusion', 'Méfiance'] },
  { nom: 'Colère', couleur: '#dc5a52', sous: ['Irritation', 'Frustration', 'Rage', 'Indignation', 'Ressentiment', 'Dégoût', 'Envie'] },
];
const emotionsChoisies = new Set();
let familleOuverte = null;

// Dans l'ordre de la taxonomie, pas dans l'ordre des touchers
const choixEmotions = () => {
  const emotions = [], familles = [];
  for (const f of TAXONOMIE) {
    const prises = f.sous.filter(e => emotionsChoisies.has(e));
    if (prises.length) { familles.push(f.nom); emotions.push(...prises); }
  }
  return { familles, emotions };
};

function afficherEmotions() {
  const zoneF = $('familles'), zoneS = $('sous');
  zoneF.innerHTML = '';
  zoneS.innerHTML = '';
  const pastille = (classe, texte, f, choisie, action) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = classe + (choisie ? ' choisie' : '');
    b.style.setProperty('--c', f.couleur);
    b.textContent = texte;
    b.setAttribute('aria-pressed', choisie);
    b.addEventListener('click', action);
    return b;
  };
  for (const f of TAXONOMIE) {
    const b = pastille('famille', f.nom, f, f.sous.some(e => emotionsChoisies.has(e)),
      () => { familleOuverte = familleOuverte === f ? null : f; afficherEmotions(); });
    if (f === familleOuverte) b.classList.add('ouverte');
    zoneF.appendChild(b);
  }
  // Famille ouverte : toutes ses sous-familles. Aucune ouverte : le rappel de ce qui est choisi.
  for (const f of familleOuverte ? [familleOuverte] : TAXONOMIE) {
    for (const e of f.sous) {
      const choisie = emotionsChoisies.has(e);
      if (!familleOuverte && !choisie) continue;
      zoneS.appendChild(pastille('sous', e, f, choisie, () => {
        choisie ? emotionsChoisies.delete(e) : emotionsChoisies.add(e);
        afficherEmotions();
      }));
    }
  }
}

// Traces discrètes : quand ont eu lieu les trois derniers dépôts, et s'ils sont partis
function afficher() {
  const ul = $('traces');
  ul.innerHTML = '';
  for (const m of mesures.slice(-3).reverse()) {
    const d = new Date(m.iso), li = document.createElement('li');
    const quand = d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' }) + ' · ' +
                  [d.getHours(), d.getMinutes()].map(n => String(n).padStart(2, '0')).join(':');
    li.innerHTML = `<span class="pastille ${m.envoye ? 'ok' : ''}"></span><span>${quand}</span>`;
    ul.appendChild(li);
  }
  const attente = mesures.filter(m => !m.envoye).length;
  $('etat').textContent = !cfg.url ? 'Google Sheet non configuré (⚙︎). Les mesures restent sur le téléphone.'
    : !/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(cfg.url) ? 'L’adresse du script doit commencer par https://script.google.com/macros/s/ et finir par /exec (⚙︎)'
    : attente ? `${attente} mesure${attente > 1 ? 's' : ''} en attente d’envoi` + (erreurEnvoi ? ` · ${erreurEnvoi}` : '')
    : '';
}

async function synchroniser() {
  if (envoiEnCours || !cfg.url) return;
  envoiEnCours = true;
  try {
    for (const m of mesures) {
      if (m.envoye) continue;
      // text/plain évite la pré-vérification CORS, qu'Apps Script ne gère pas
      const r = await fetch(cfg.url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          id: m.id, iso: m.iso, valeur: m.valeur, note: m.note || '',
          familles: (m.familles || []).join(', '), emotions: (m.emotions || []).join(', '),
        }),
      });
      const texte = await r.text();
      let rep;
      try { rep = JSON.parse(texte); } catch { throw new Error(`réponse inattendue du script (${r.status})`); }
      if (!rep.ok) throw new Error(rep.erreur || 'refus');
      m.envoye = true;
      erreurEnvoi = '';
      ecrire(CLE_MESURES, mesures);
      afficher();
    }
  } catch (e) {
    // hors ligne ou script injoignable : on réessaiera
    erreurEnvoi = !navigator.onLine ? 'hors ligne'
      : e instanceof TypeError ? 'script injoignable : vérifier « Qui a accès : Tout le monde »'
      : e.message;
  } finally {
    envoiEnCours = false;
    afficher();
  }
}

$('enregistrer').addEventListener('click', () => {
  const maintenant = new Date();
  const id = maintenant.getTime().toString(36) + Math.random().toString(36).slice(2, 8);
  mesures.push({
    id,
    iso: isoLocal(maintenant),
    valeur,
    ...choixEmotions(),
    note: $('note').value.trim(),
    envoye: false,
  });
  $('note').value = '';
  $('note').blur();
  emotionsChoisies.clear();
  familleOuverte = null;
  afficherEmotions();
  ecrire(CLE_MESURES, mesures);
  if (navigator.vibrate) navigator.vibrate(30);
  const b = $('enregistrer');
  b.textContent = 'Enregistré ✓';
  setTimeout(() => { b.textContent = 'Enregistrer'; }, 1200);
  afficher();
  synchroniser();
  // Le Raccourci lit Santé et complète la même ligne du Sheet, retrouvée par l'id
  if (cfg.raccourci) {
    location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(cfg.raccourci) + '&input=text&text=' + id;
  }
});

$('ouvrirReglages').addEventListener('click', () => {
  $('url').value = cfg.url;
  $('pas').value = String(cfg.pas);
  $('raccourci').value = cfg.raccourci;
  $('reglages').showModal();
});

$('fermerReglages').addEventListener('click', () => {
  cfg = { url: $('url').value.trim(), pas: Number($('pas').value), raccourci: $('raccourci').value.trim() };
  ecrire(CLE_CFG, cfg);
  $('reglages').close();
  reglerValeur(valeur);
  afficher();
  synchroniser();
});

$('exporter').addEventListener('click', () => {
  const guillemets = t => `"${String(t || '').replace(/"/g, '""')}"`;
  const liste = l => guillemets((l || []).join(', '));
  const lignes = ['horodatage,valeur,familles,emotions,note,id',
    ...mesures.map(m => `${m.iso},${m.valeur},${liste(m.familles)},${liste(m.emotions)},${guillemets(m.note)},${m.id}`)];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lignes.join('\n')], { type: 'text/csv' }));
  a.download = 'brouillard.csv';
  a.click();
});

window.addEventListener('online', synchroniser);
document.addEventListener('visibilitychange', () => { if (!document.hidden) synchroniser(); });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');

initialiserCadran();
reglerValeur(valeur);
afficherEmotions();
afficher();
synchroniser();
</script>
</body>
</html>
